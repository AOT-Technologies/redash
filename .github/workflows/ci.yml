name: CI - formsflow-analytics

on:
  workflow_dispatch:

  push:
    branches:
      - formsflow-main

  pull_request:
    branches:
      - formsflow-main
      - formsflow-develop

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: 24
  PNPM_VERSION: 10.30.3

jobs:

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install linters
        run: |
          pip install black==23.1.0 ruff==0.0.287

      - name: Ruff
        run: |
          ruff check .

      - name: Black
        run: |
          black --check .

  backend-unit-tests:
    name: Backend Unit Test
    needs: backend-lint
    runs-on: ubuntu-24.04

    env:
      COMPOSE_FILE: .ci/compose.ci.yaml
      COMPOSE_PROJECT_NAME: redash
      COMPOSE_DOCKER_CLI_BUILD: 1
      DOCKER_BUILDKIT: 1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build Docker Images
        run: |
          set -x
          docker compose build --build-arg install_groups="main,all_ds,dev"
          docker compose up -d
          sleep 10

      - name: Create Test Database
        run: |
          docker compose -p redash run --rm postgres psql -h postgres -U postgres -c "create database tests;"

      - name: List Enabled Query Runners
        run: |
          docker compose -p redash run --rm redash manage ds list_types

      - name: Run Tests
        run: |
          docker compose -p redash run --name tests redash tests --junitxml=junit.xml --cov-report=xml --cov=redash --cov-config=.coveragerc tests/

      - name: Copy Test Results
        if: always()
        run: |
          mkdir -p /tmp/test-results/unit-tests
          docker cp tests:/app/coverage.xml ./coverage.xml
          docker cp tests:/app/junit.xml /tmp/test-results/unit-tests/results.xml

      - name: Store Test Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: /tmp/test-results

      - name: Store Coverage Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage.xml

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Lint
        run: |
          pnpm run lint:ci

  frontend-unit-tests:
    name: Frontend Unit Test
    needs: frontend-lint
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Run app tests
        run: |
          pnpm run test

      - name: Run visualizations tests
        run: |
          pnpm --filter @redash/viz test

      - name: Lint
        run: |
          pnpm run lint

  build:
    name: Build and Trivy Security Scan
    needs:
      - backend-unit-tests
      - frontend-unit-tests
    runs-on: ${{ matrix.runner }}

    # Each architecture builds on a native runner, so arm64 build failures show up before merge.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build Docker image
        run: |
          docker build \
            --tag formsflow-analytics:ci \
            .

      - name: Verify Docker image
        run: |
          docker image inspect formsflow-analytics:ci

      # Scanned in this job rather than a separate one, so the image is only built once.
      - name: Run Trivy image scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: formsflow-analytics:ci
          format: table
          exit-code: "0"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  snyk:
    name: Snyk Security Scan
    needs: build
    runs-on: ubuntu-24.04
    continue-on-error: true

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Snyk
        run: |
          npm install -g snyk

      - name: Authenticate Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk auth "$SNYK_TOKEN"

      - name: Snyk Open Source
        continue-on-error: true
        run: |
          snyk test \
            --all-projects \
            --severity-threshold=high

      - name: Snyk Code
        continue-on-error: true
        run: |
          snyk code test \
            --severity-threshold=high
