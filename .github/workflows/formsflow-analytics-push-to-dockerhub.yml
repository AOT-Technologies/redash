name: CD - formsflow-analytics

on:
  workflow_dispatch:
  push:
    branches: [ formsflow-main, formsflow-develop ]

defaults:
  run:
    shell: bash

env:
  IMAGE: formsflow/redash

jobs:

  # ============================================================
  # 1. VERSION
  # ============================================================
  version:
    if: github.repository == 'AOT-Technologies/redash'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check VERSION matches package.json
        run: |
          EXPECTED="v$(jq -r .version package.json)"
          ACTUAL="$(cat VERSION)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: VERSION ($ACTUAL) does not match package.json ($EXPECTED)" >&2
            exit 1
          fi

      # The formsflow-main branch publishes release images, so it drops the -alpha suffix.
      - name: Set version
        id: version
        run: |
          VER=$(cat VERSION)
          if [ "$GITHUB_REF" = "refs/heads/formsflow-main" ]; then
            VER=${VER/-alpha/''}
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VER"

  # ============================================================
  # 2. BUILD AND PUSH EACH ARCHITECTURE
  #
  # Each architecture builds on a native runner and is pushed by
  # digest only. The merge job tags the multi-arch image.
  # ============================================================
  build:
    needs: version
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set platform pair
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      # ----------------------------------------------------------
      # Docker metadata
      # ----------------------------------------------------------
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: |
            ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}

      # ----------------------------------------------------------
      # Docker Hub OIDC
      # ----------------------------------------------------------
      - name: Get Docker token
        id: docker_oidc
        uses: docker/oidc-action@2500c95e182cadc20f0ead5f96113ee82c736e88
        with:
          connection-id: ${{ secrets.DOCKER_OIDC_CONNECTION_ID }}
          expires-in: 1800

      - name: Docker login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKER_HUB_ORG_USERNAME }}
          password: ${{ steps.docker_oidc.outputs.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
        with:
          driver: docker-container

      # ----------------------------------------------------------
      # Build and push by digest
      # ----------------------------------------------------------
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # ============================================================
  # 3. MERGE INTO A MULTI-ARCH IMAGE, TAG AND SIGN
  # ============================================================
  merge:
    needs:
      - version
      - build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    outputs:
      image: ${{ steps.image-output.outputs.image }}
      digest: ${{ steps.image-output.outputs.digest }}

    steps:
      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      # ----------------------------------------------------------
      # Cosign
      # ----------------------------------------------------------
      - name: Install cosign
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 # v3.5.0

      # ----------------------------------------------------------
      # Docker Hub OIDC
      # ----------------------------------------------------------
      - name: Get Docker token
        id: docker_oidc
        uses: docker/oidc-action@2500c95e182cadc20f0ead5f96113ee82c736e88
        with:
          connection-id: ${{ secrets.DOCKER_OIDC_CONNECTION_ID }}
          expires-in: 1800

      - name: Docker login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKER_HUB_ORG_USERNAME }}
          password: ${{ steps.docker_oidc.outputs.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      # ----------------------------------------------------------
      # Tag the multi-arch image (latest only on formsflow-main)
      # ----------------------------------------------------------
      - name: Create and push the multi-arch image
        working-directory: ${{ runner.temp }}/digests
        env:
          VERSION: ${{ needs.version.outputs.version }}
          LATEST: ${{ github.ref == 'refs/heads/formsflow-main' }}
        run: |
          set -euo pipefail

          TAGS=(-t "${IMAGE}:${VERSION}")
          if [ "$LATEST" = "true" ]; then
            TAGS+=(-t "${IMAGE}:latest")
          fi

          SOURCES=()
          for DIGEST in *; do
            SOURCES+=("${IMAGE}@sha256:${DIGEST}")
          done

          docker buildx imagetools create "${TAGS[@]}" "${SOURCES[@]}"

      - name: Inspect image
        id: inspect
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail

          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------
      # Sign the index and each platform image by immutable digest
      # ----------------------------------------------------------
      - name: Sign published Docker image
        env:
          DIGEST: ${{ steps.inspect.outputs.digest }}
        run: |
          set -euo pipefail

          echo "Signing:"
          echo "${IMAGE}@${DIGEST}"
          cosign sign --yes --recursive "${IMAGE}@${DIGEST}"

      # ----------------------------------------------------------
      # Image output
      # ----------------------------------------------------------
      - name: Set image output
        id: image-output
        env:
          VERSION: ${{ needs.version.outputs.version }}
          DIGEST: ${{ steps.inspect.outputs.digest }}
        run: |
          echo "image=${IMAGE}:${VERSION}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

          echo "Docker image:"
          echo "${IMAGE}:${VERSION}"

          echo "Docker digest:"
          echo "$DIGEST"

  # ============================================================
  # 4. DOCKER PUSH NOTIFICATION
  # ============================================================
  docker-notification:
    name: Docker Push Notification

    needs:
      - merge

    if: ${{ always() && (github.repository == 'AOT-Technologies/redash') }}

    runs-on: ubuntu-latest

    steps:
      - name: Send Google Chat notification
        env:
          STATUS: ${{ needs.merge.result }}
          COMPONENT: "formsflow-analytics"
          IMAGE: ${{ needs.merge.outputs.image }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WEBHOOK: ${{ secrets.GOOGLE_CHAT_DOCKER_WEBHOOK_URL }}
        run: |
          set -e

          if [ -z "$WEBHOOK" ]; then
            echo "::warning::GOOGLE_CHAT_DOCKER_WEBHOOK_URL is not set; skipping the notification."
            exit 0
          fi

          DATE_TIME=$(date -u '+%Y-%m-%d %H:%M:%S UTC')

          if [ "$STATUS" = "success" ]; then
            TITLE="🐳 Docker Image Push Successful"
            STATUS_TEXT="✅ PUSH SUCCESSFUL"
            MESSAGE_TEXT="Docker image was successfully pushed to Docker Hub."
          else
            TITLE="🚨 Docker Image Push Failed"
            STATUS_TEXT="❌ PUSH FAILED"
            MESSAGE_TEXT="Docker image was NOT successfully pushed to Docker Hub."
          fi

          MESSAGE=$(jq -n \
            --arg title "$TITLE" \
            --arg component "$COMPONENT" \
            --arg image "$IMAGE" \
            --arg branch "$BRANCH" \
            --arg commit "$COMMIT" \
            --arg actor "$ACTOR" \
            --arg status "$STATUS_TEXT" \
            --arg date_time "$DATE_TIME" \
            --arg message "$MESSAGE_TEXT" \
            --arg run_url "$RUN_URL" \
            '{
              text: (
                $title + "\n\n" +
                "*Component:* " + $component + "\n" +
                "*Image:* " + $image + "\n" +
                "*Branch:* " + $branch + "\n" +
                "*Commit:* " + $commit + "\n" +
                "*Triggered by:* " + $actor + "\n" +
                "*Status:* " + $status + "\n" +
                "*Date & Time:* " + $date_time + "\n\n" +
                "📦 " + $message + "\n\n" +
                "🔗 " + $run_url
              )
            }')

          curl --fail-with-body \
            --retry 3 \
            --retry-delay 2 \
            -X POST \
            -H "Content-Type: application/json; charset=UTF-8" \
            -d "$MESSAGE" \
            "$WEBHOOK"
