name: CD - formsflow-analytics

on:
  workflow_dispatch:
  push:
    branches: [ formsflow-main, formsflow-develop ]

defaults:
  run:
    shell: bash

env:
  CE_IMAGE_NAME: formsflow/redash
  EE_IMAGE_NAME: formsflow/redash-ee
  # Every Kubernetes deployment that runs the analytics image.
  # Each deployment has a container with the same name.
  DEPLOYMENTS: >-
    forms-flow-analytics-server
    forms-flow-analytics-scheduler
    forms-flow-analytics-worker
    forms-flow-analytics-adhoc-worker
    forms-flow-analytics-scheduled-worker

jobs:

  # ============================================================
  # 1. VERSION
  # ============================================================
  version:
    if: github.repository == 'AOT-Technologies/redash'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check VERSION matches package.json
        run: |
          EXPECTED="v$(jq -r .version package.json)"
          ACTUAL="$(cat VERSION)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: VERSION ($ACTUAL) does not match package.json ($EXPECTED)" >&2
            exit 1
          fi

      # The formsflow-main branch publishes release images, so it drops the -alpha suffix.
      - name: Set version
        id: version
        run: |
          VER=$(cat VERSION)
          if [ "$GITHUB_REF" = "refs/heads/formsflow-main" ]; then
            VER=${VER/-alpha/''}
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VER"

  # ============================================================
  # 2. BUILD AND PUSH EACH ARCHITECTURE
  #
  # Each architecture builds on a native runner and is pushed by
  # digest only, to both the CE and the EE repository. The next
  # job tags the multi-arch images.
  # ============================================================
  build:
    needs: version
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set platform pair
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      # ----------------------------------------------------------
      # Docker metadata
      # ----------------------------------------------------------
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: |
            ${{ env.CE_IMAGE_NAME }}
            ${{ env.EE_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}

      # ----------------------------------------------------------
      # Docker Hub OIDC
      # ----------------------------------------------------------
      - name: Get Docker token
        id: docker_oidc
        uses: docker/oidc-action@2500c95e182cadc20f0ead5f96113ee82c736e88
        with:
          connection-id: ${{ secrets.DOCKER_OIDC_CONNECTION_ID }}
          expires-in: 1800

      - name: Docker login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKER_HUB_ORG_USERNAME }}
          password: ${{ steps.docker_oidc.outputs.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
        with:
          driver: docker-container

      # ----------------------------------------------------------
      # Build and push by digest
      # ----------------------------------------------------------
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,"name=${{ env.CE_IMAGE_NAME }},${{ env.EE_IMAGE_NAME }}",push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # ============================================================
  # 3. MERGE INTO MULTI-ARCH IMAGES, TAG AND SIGN
  # ============================================================
  build-and-push-image-to-dockerhub:
    needs:
      - version
      - build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    outputs:
      image: ${{ steps.image-output.outputs.image }}
      digest: ${{ steps.image-output.outputs.digest }}

    steps:
      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      # ----------------------------------------------------------
      # Cosign
      # ----------------------------------------------------------
      - name: Install cosign
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 # v3.5.0

      # ----------------------------------------------------------
      # Docker Hub OIDC
      # ----------------------------------------------------------
      - name: Get Docker token
        id: docker_oidc
        uses: docker/oidc-action@2500c95e182cadc20f0ead5f96113ee82c736e88
        with:
          connection-id: ${{ secrets.DOCKER_OIDC_CONNECTION_ID }}
          expires-in: 1800

      - name: Docker login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKER_HUB_ORG_USERNAME }}
          password: ${{ steps.docker_oidc.outputs.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      # ----------------------------------------------------------
      # Tag the multi-arch images (latest only on formsflow-main)
      # ----------------------------------------------------------
      - name: Create and push the multi-arch images
        working-directory: ${{ runner.temp }}/digests
        env:
          VERSION: ${{ needs.version.outputs.version }}
          LATEST: ${{ github.ref == 'refs/heads/formsflow-main' }}
        run: |
          set -euo pipefail

          for IMAGE in "$CE_IMAGE_NAME" "$EE_IMAGE_NAME"; do
            TAGS=(-t "${IMAGE}:${VERSION}")
            if [ "$LATEST" = "true" ]; then
              TAGS+=(-t "${IMAGE}:latest")
            fi

            SOURCES=()
            for DIGEST in *; do
              SOURCES+=("${IMAGE}@sha256:${DIGEST}")
            done

            docker buildx imagetools create "${TAGS[@]}" "${SOURCES[@]}"
          done

      # The deploy jobs use one digest for both images, so the CE and
      # EE indexes must be identical.
      - name: Inspect images
        id: inspect
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail

          docker buildx imagetools inspect "${CE_IMAGE_NAME}:${VERSION}"

          CE_DIGEST=$(docker buildx imagetools inspect "${CE_IMAGE_NAME}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)
          EE_DIGEST=$(docker buildx imagetools inspect "${EE_IMAGE_NAME}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)

          echo "CE digest: ${CE_DIGEST}"
          echo "EE digest: ${EE_DIGEST}"

          if [ "$CE_DIGEST" != "$EE_DIGEST" ]; then
            echo "ERROR: ${CE_IMAGE_NAME} and ${EE_IMAGE_NAME} have different digests." >&2
            exit 1
          fi

          echo "digest=${CE_DIGEST}" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------
      # Sign the index and each platform image by immutable digest
      # ----------------------------------------------------------
      - name: Sign published Docker images
        env:
          DIGEST: ${{ steps.inspect.outputs.digest }}
        run: |
          set -euo pipefail

          for IMAGE in "$CE_IMAGE_NAME" "$EE_IMAGE_NAME"; do
            echo "Signing:"
            echo "${IMAGE}@${DIGEST}"
            cosign sign --yes --recursive "${IMAGE}@${DIGEST}"
          done

      # ----------------------------------------------------------
      # Image output
      # ----------------------------------------------------------
      - name: Set image output
        id: image-output
        env:
          VERSION: ${{ needs.version.outputs.version }}
          DIGEST: ${{ steps.inspect.outputs.digest }}
        run: |
          IMAGE="${CE_IMAGE_NAME}:${VERSION}"

          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

          echo "Docker image:"
          echo "$IMAGE"

          echo "Docker digest:"
          echo "$DIGEST"

  # ============================================================
  # 4. DOCKER PUSH NOTIFICATION
  # ============================================================
  docker-notification:
    name: Docker Push Notification

    needs:
      - build-and-push-image-to-dockerhub

    if: ${{ always() && github.repository == 'AOT-Technologies/redash' }}

    uses: ./.github/workflows/docker-image-release-notify.yml

    with:
      notification_type: docker
      status: ${{ needs.build-and-push-image-to-dockerhub.result }}
      component: "formsflow-analytics"
      image: ${{ needs.build-and-push-image-to-dockerhub.outputs.image }}
      branch: ${{ github.ref_name }}
      commit: ${{ github.sha }}
      actor: ${{ github.actor }}
      workflow: ${{ github.workflow }}
      run_url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

    secrets: inherit

  # ============================================================
  # 5. DEPLOY TO DEV EKS
  # ============================================================
  deploy-to-dev-eks:
    name: Deploy Forms Flow Analytics to DEV EKS

    needs:
      - build-and-push-image-to-dockerhub

    if: ${{ needs.build-and-push-image-to-dockerhub.result == 'success' }}

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ secrets.REGION }}
      CE_IMAGE: formsflow/redash@${{ needs.build-and-push-image-to-dockerhub.outputs.digest }}
      EE_IMAGE: formsflow/redash-ee@${{ needs.build-and-push-image-to-dockerhub.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # ----------------------------------------------------------
      # Docker Hub OIDC
      # ----------------------------------------------------------
      - name: Get Docker token
        id: docker_oidc
        uses: docker/oidc-action@2500c95e182cadc20f0ead5f96113ee82c736e88
        with:
          connection-id: ${{ secrets.DOCKER_OIDC_CONNECTION_ID }}
          expires-in: 1800

      - name: Docker login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKER_HUB_ORG_USERNAME }}
          password: ${{ steps.docker_oidc.outputs.token }}

      # ----------------------------------------------------------
      # Cosign
      # ----------------------------------------------------------
      - name: Install cosign
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 # v3.5.0

      # ----------------------------------------------------------
      # Verify signed Docker CE image
      # ----------------------------------------------------------
      - name: Verify signed Docker CE image
        run: |
          set -euo pipefail
          echo "Verifying image signature for: $CE_IMAGE"
          if cosign verify \
            "$CE_IMAGE" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/formsflow-analytics-cd.yml@${{ github.ref }}"; then
            echo "Image signature successfully verified for: $CE_IMAGE"
          else
            echo "ERROR: Image signature verification failed for $CE_IMAGE! Aborting deployment." >&2
            exit 1
          fi

      # ----------------------------------------------------------
      # Verify signed Docker EE image
      # ----------------------------------------------------------
      - name: Verify signed Docker EE image
        run: |
          set -euo pipefail
          echo "Verifying image signature for: $EE_IMAGE"
          if cosign verify \
            "$EE_IMAGE" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/formsflow-analytics-cd.yml@${{ github.ref }}"; then
            echo "Image signature successfully verified for: $EE_IMAGE"
          else
            echo "ERROR: Image signature verification failed for $EE_IMAGE! Aborting deployment." >&2
            exit 1
          fi

      # ----------------------------------------------------------
      # AWS GitHub OIDC
      # ----------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.REGION }}

      # ----------------------------------------------------------
      # Configure kubeconfig
      # ----------------------------------------------------------
      - name: Configure kubectl
        shell: bash
        env:
          DEV_EKS_CLUSTER: ${{ secrets.DEV_EKS_CLUSTER }}
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$DEV_EKS_CLUSTER"

      - name: Verify Kubernetes access
        shell: bash
        run: |
          kubectl cluster-info

      # ----------------------------------------------------------
      # Show image
      # ----------------------------------------------------------
      - name: Show deployment image
        run: |
          echo "Deploying:"
          echo "$EE_IMAGE"
          echo "$CE_IMAGE"

      # ========================================================
      # DEV EE MULTITENANT NAMESPACE
      # ========================================================
      - name: Deploy to DEV EE Multitenant namespace
        shell: bash
        env:
          NAMESPACE: ${{ secrets.DEV_EE_MULTITENANT_NAMESPACE }}
        run: |
          echo "Deploying image:"
          echo "$EE_IMAGE"

          for NAME in $DEPLOYMENTS; do
            kubectl -n "$NAMESPACE" \
              patch deployment "$NAME" \
              -p '{"spec":{"template":{"spec":{"containers":[{"name":"'"$NAME"'","image":"'"$EE_IMAGE"'"}]}}}}'
          done

          for NAME in $DEPLOYMENTS; do
            kubectl -n "$NAMESPACE" \
              rollout restart deployment "$NAME"
          done

          for NAME in $DEPLOYMENTS; do
            kubectl -n "$NAMESPACE" \
              rollout status deployment "$NAME" \
              --timeout=5m
          done

      # ========================================================
      # DEV EE NAMESPACE
      # ========================================================
      - name: Deploy to DEV EE namespace
        shell: bash
        env:
          NAMESPACE: ${{ secrets.DEV_EE_NAMESPACE }}
        run: |
          echo "Deploying image:"
          echo "$EE_IMAGE"

          for NAME in $DEPLOYMENTS; do
            kubectl -n "$NAMESPACE" \
              patch deployment "$NAME" \
              -p '{"spec":{"template":{"spec":{"containers":[{"name":"'"$NAME"'","image":"'"$EE_IMAGE"'"}]}}}}'
          done

          for NAME in $DEPLOYMENTS; do
            kubectl -n "$NAMESPACE" \
              rollout restart deployment "$NAME"
          done

          for NAME in $DEPLOYMENTS; do
            kubectl -n "$NAMESPACE" \
              rollout status deployment "$NAME" \
              --timeout=5m
          done

      # ========================================================
      # DEV OPEN SOURCE NAMESPACE
      # ========================================================
      - name: Deploy to DEV Open Source namespace
        shell: bash
        env:
          NAMESPACE: ${{ secrets.DEV_OPENSOURCE_NAMESPACE }}
        run: |
          echo "Deploying image:"
          echo "$CE_IMAGE"

          for NAME in $DEPLOYMENTS; do
            kubectl -n "$NAMESPACE" \
              patch deployment "$NAME" \
              -p '{"spec":{"template":{"spec":{"containers":[{"name":"'"$NAME"'","image":"'"$CE_IMAGE"'"}]}}}}'
          done

          for NAME in $DEPLOYMENTS; do
            kubectl -n "$NAMESPACE" \
              rollout restart deployment "$NAME"
          done

          for NAME in $DEPLOYMENTS; do
            kubectl -n "$NAMESPACE" \
              rollout status deployment "$NAME" \
              --timeout=5m
          done

      # ----------------------------------------------------------
      # Verify deployments
      # ----------------------------------------------------------
      - name: Verify deployments
        shell: bash
        env:
          DEV_EE_MULTITENANT_NAMESPACE: ${{ secrets.DEV_EE_MULTITENANT_NAMESPACE }}
          DEV_EE_NAMESPACE: ${{ secrets.DEV_EE_NAMESPACE }}
          DEV_OPENSOURCE_NAMESPACE: ${{ secrets.DEV_OPENSOURCE_NAMESPACE }}
        run: |
          read -ra NAMES <<< "$DEPLOYMENTS"

          echo "DEV EE Multitenant:"
          kubectl -n "$DEV_EE_MULTITENANT_NAMESPACE" \
            get deployment "${NAMES[@]}"
          echo "DEV EE:"
          kubectl -n "$DEV_EE_NAMESPACE" \
            get deployment "${NAMES[@]}"
          echo "DEV Open Source:"
          kubectl -n "$DEV_OPENSOURCE_NAMESPACE" \
            get deployment "${NAMES[@]}"

  # ============================================================
  # 6. DEPLOY TO QA EKS
  # ============================================================
  deploy-to-qa-eks:
    name: Deploy Forms Flow Analytics to QA EKS

    needs:
      - build-and-push-image-to-dockerhub

    if: ${{ needs.build-and-push-image-to-dockerhub.result == 'success' }}

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ secrets.REGION }}
      CE_IMAGE: formsflow/redash@${{ needs.build-and-push-image-to-dockerhub.outputs.digest }}
      EE_IMAGE: formsflow/redash-ee@${{ needs.build-and-push-image-to-dockerhub.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # ----------------------------------------------------------
      # Docker Hub OIDC
      # ----------------------------------------------------------
      - name: Get Docker token
        id: docker_oidc
        uses: docker/oidc-action@2500c95e182cadc20f0ead5f96113ee82c736e88
        with:
          connection-id: ${{ secrets.DOCKER_OIDC_CONNECTION_ID }}
          expires-in: 1800

      - name: Docker login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKER_HUB_ORG_USERNAME }}
          password: ${{ steps.docker_oidc.outputs.token }}

      # ----------------------------------------------------------
      # Cosign
      # ----------------------------------------------------------
      - name: Install cosign
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 # v3.5.0

      # ----------------------------------------------------------
      # Verify signed Docker CE image
      # ----------------------------------------------------------
      - name: Verify signed Docker CE image
        run: |
          set -euo pipefail
          echo "Verifying image signature for: $CE_IMAGE"
          if cosign verify \
            "$CE_IMAGE" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/formsflow-analytics-cd.yml@${{ github.ref }}"; then
            echo "Image signature successfully verified for: $CE_IMAGE"
          else
            echo "ERROR: Image signature verification failed for $CE_IMAGE! Aborting deployment." >&2
            exit 1
          fi

      # ----------------------------------------------------------
      # Verify signed Docker EE image
      # ----------------------------------------------------------
      - name: Verify signed Docker EE image
        run: |
          set -euo pipefail
          echo "Verifying image signature for: $EE_IMAGE"
          if cosign verify \
            "$EE_IMAGE" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/formsflow-analytics-cd.yml@${{ github.ref }}"; then
            echo "Image signature successfully verified for: $EE_IMAGE"
          else
            echo "ERROR: Image signature verification failed for $EE_IMAGE! Aborting deployment." >&2
            exit 1
          fi

      # ----------------------------------------------------------
      # AWS GitHub OIDC
      # ----------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.REGION }}

      # ----------------------------------------------------------
      # Configure kubeconfig
      # ----------------------------------------------------------
      - name: Configure kubectl
        shell: bash
        env:
          QA_EKS_CLUSTER: ${{ secrets.QA_EKS_CLUSTER }}
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$QA_EKS_CLUSTER"

      - name: Verify Kubernetes access
        shell: bash
        run: |
          kubectl cluster-info

      # ----------------------------------------------------------
      # Show image
      # ----------------------------------------------------------
      - name: Show deployment image
        run: |
          echo "Deploying:"
          echo "$EE_IMAGE"
          echo "$CE_IMAGE"

      # ========================================================
      # QA MULTITENANT NAMESPACE
      # ========================================================
      - name: Deploy to QA Multitenant namespace
        shell: bash
        env:
          NAMESPACE: ${{ secrets.QA_EE_MULTITENANT_NAMESPACE }}
        run: |
          echo "Deploying image:"
          echo "$EE_IMAGE"

          for NAME in $DEPLOYMENTS; do
            kubectl -n "$NAMESPACE" \
              patch deployment "$NAME" \
              -p '{"spec":{"template":{"spec":{"containers":[{"name":"'"$NAME"'","image":"'"$EE_IMAGE"'"}]}}}}'
          done

          for NAME in $DEPLOYMENTS; do
            kubectl -n "$NAMESPACE" \
              rollout restart deployment "$NAME"
          done

          for NAME in $DEPLOYMENTS; do
            kubectl -n "$NAMESPACE" \
              rollout status deployment "$NAME" \
              --timeout=5m
          done

      # ========================================================
      # QA EE NAMESPACE
      # ========================================================
      - name: Deploy to QA EE namespace
        shell: bash
        env:
          NAMESPACE: ${{ secrets.QA_EE_NAMESPACE }}
        run: |
          echo "Deploying image:"
          echo "$EE_IMAGE"

          for NAME in $DEPLOYMENTS; do
            kubectl -n "$NAMESPACE" \
              patch deployment "$NAME" \
              -p '{"spec":{"template":{"spec":{"containers":[{"name":"'"$NAME"'","image":"'"$EE_IMAGE"'"}]}}}}'
          done

          for NAME in $DEPLOYMENTS; do
            kubectl -n "$NAMESPACE" \
              rollout restart deployment "$NAME"
          done

          for NAME in $DEPLOYMENTS; do
            kubectl -n "$NAMESPACE" \
              rollout status deployment "$NAME" \
              --timeout=5m
          done

      # ========================================================
      # QA OPEN SOURCE NAMESPACE
      # ========================================================
      - name: Deploy to QA Open Source namespace
        shell: bash
        env:
          NAMESPACE: ${{ secrets.QA_OPENSOURCE_NAMESPACE }}
        run: |
          echo "Deploying image:"
          echo "$CE_IMAGE"

          for NAME in $DEPLOYMENTS; do
            kubectl -n "$NAMESPACE" \
              patch deployment "$NAME" \
              -p '{"spec":{"template":{"spec":{"containers":[{"name":"'"$NAME"'","image":"'"$CE_IMAGE"'"}]}}}}'
          done

          for NAME in $DEPLOYMENTS; do
            kubectl -n "$NAMESPACE" \
              rollout restart deployment "$NAME"
          done

          for NAME in $DEPLOYMENTS; do
            kubectl -n "$NAMESPACE" \
              rollout status deployment "$NAME" \
              --timeout=5m
          done

      # ----------------------------------------------------------
      # Verify deployments
      # ----------------------------------------------------------
      - name: Verify deployments
        shell: bash
        env:
          QA_EE_MULTITENANT_NAMESPACE: ${{ secrets.QA_EE_MULTITENANT_NAMESPACE }}
          QA_EE_NAMESPACE: ${{ secrets.QA_EE_NAMESPACE }}
          QA_OPENSOURCE_NAMESPACE: ${{ secrets.QA_OPENSOURCE_NAMESPACE }}
        run: |
          read -ra NAMES <<< "$DEPLOYMENTS"

          echo "QA Multitenant:"
          kubectl -n "$QA_EE_MULTITENANT_NAMESPACE" \
            get deployment "${NAMES[@]}"
          echo "QA EE:"
          kubectl -n "$QA_EE_NAMESPACE" \
            get deployment "${NAMES[@]}"
          echo "QA Open Source:"
          kubectl -n "$QA_OPENSOURCE_NAMESPACE" \
            get deployment "${NAMES[@]}"

  # ============================================================
  # 7. KUBERNETES DEV DEPLOYMENT NOTIFICATION
  # ============================================================
  kubernetes-notification-dev:
    name: Kubernetes DEV Deployment Notification

    needs:
      - build-and-push-image-to-dockerhub
      - deploy-to-dev-eks

    if: ${{ always() && github.repository == 'AOT-Technologies/redash' }}

    uses: ./.github/workflows/docker-image-release-notify.yml

    with:
      notification_type: kubernetes
      status: ${{ needs.deploy-to-dev-eks.result }}
      component: "formsflow-analytics"
      image: ${{ needs.build-and-push-image-to-dockerhub.outputs.image }}
      branch: ${{ github.ref_name }}
      commit: ${{ github.sha }}
      actor: ${{ github.actor }}
      workflow: ${{ github.workflow }}
      run_url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      environment: "DEV"
      namespace: "DEV EE Multitenant, EE, Open Source"
      deployment: "forms-flow-analytics (server, scheduler, workers)"

    secrets: inherit

  # ============================================================
  # 8. KUBERNETES QA DEPLOYMENT NOTIFICATION
  # ============================================================
  kubernetes-notification-qa:
    name: Kubernetes QA Deployment Notification

    needs:
      - build-and-push-image-to-dockerhub
      - deploy-to-qa-eks

    if: ${{ always() && github.repository == 'AOT-Technologies/redash' }}

    uses: ./.github/workflows/docker-image-release-notify.yml

    with:
      notification_type: kubernetes
      status: ${{ needs.deploy-to-qa-eks.result }}
      component: "formsflow-analytics"
      image: ${{ needs.build-and-push-image-to-dockerhub.outputs.image }}
      branch: ${{ github.ref_name }}
      commit: ${{ github.sha }}
      actor: ${{ github.actor }}
      workflow: ${{ github.workflow }}
      run_url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      environment: "QA"
      namespace: "QA EE Multitenant, EE, Open Source"
      deployment: "forms-flow-analytics (server, scheduler, workers)"

    secrets: inherit

  # ============================================================
  # 9. CALCULATE OVERALL WORKFLOW STATUS
  # ============================================================
  workflow-status:
    name: Calculate Overall Workflow Status

    needs:
      - build-and-push-image-to-dockerhub
      - deploy-to-dev-eks
      - deploy-to-qa-eks

    if: ${{ always() && github.repository == 'AOT-Technologies/redash' }}

    runs-on: ubuntu-latest

    outputs:
      status: ${{ steps.status.outputs.status }}

    steps:
      - name: Calculate status
        id: status
        shell: bash
        run: |
          BUILD_RESULT="${{ needs.build-and-push-image-to-dockerhub.result }}"
          DEV_RESULT="${{ needs.deploy-to-dev-eks.result }}"
          QA_RESULT="${{ needs.deploy-to-qa-eks.result }}"

          echo "Build result: $BUILD_RESULT"
          echo "DEV Deploy result: $DEV_RESULT"
          echo "QA Deploy result: $QA_RESULT"

          if [ "$BUILD_RESULT" = "success" ] && [ "$DEV_RESULT" = "success" ] && [ "$QA_RESULT" = "success" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
          fi

  # ============================================================
  # 10. OVERALL WORKFLOW NOTIFICATION
  # ============================================================
  workflow-notification:
    name: Overall Workflow Notification

    needs:
      - build-and-push-image-to-dockerhub
      - deploy-to-dev-eks
      - deploy-to-qa-eks
      - workflow-status

    if: ${{ always() && github.repository == 'AOT-Technologies/redash' }}

    uses: ./.github/workflows/docker-image-release-notify.yml

    with:
      notification_type: workflow
      status: ${{ needs.workflow-status.outputs.status }}
      component: "formsflow-analytics"
      image: ${{ needs.build-and-push-image-to-dockerhub.outputs.image }}
      branch: ${{ github.ref_name }}
      commit: ${{ github.sha }}
      actor: ${{ github.actor }}
      workflow: ${{ github.workflow }}
      run_url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      environment: "DEV + QA"
      namespace: "DEV & QA Multitenant, Opensource, Enterprise"
      deployment: "forms-flow-analytics (server, scheduler, workers)"

    secrets: inherit
